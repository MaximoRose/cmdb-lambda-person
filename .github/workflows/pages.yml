name: Deploy to GitHub Pages

on:
  push:
    branches: [main]        # déclenché à chaque push sur main
  workflow_run:
    workflows: ["Fetch Airtable data"]
    types: [completed]      # déclenché après chaque mise à jour de data.json
  workflow_dispatch:        # déclenchement manuel possible

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/           # seul ce dossier est déployé

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
