<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma cartographie de services</title>
  <!-- Hash du dernier commit Git, injecté par le workflow pages.yml -->
  <meta name="git-commit" content="__GIT_COMMIT__">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --couleur-fond-principal:    #0f1117;
      --couleur-fond-secondaire:   #181c27;
      --couleur-fond-tertiaire:    #1e2235;
      --couleur-bordure-subtile:   rgba(255,255,255,0.08);
      --couleur-bordure-normale:   rgba(255,255,255,0.14);
      --couleur-texte-principal:   #e8eaf0;
      --couleur-texte-secondaire:  #8b90a0;
      --couleur-texte-discret:     #555b70;
      --couleur-accent:            #4f8ef7;
      --rayon-bordure:             10px;
      --police-sans:               'DM Sans', sans-serif;
      --police-mono:               'DM Mono', monospace;
    }

    body {
      background: var(--couleur-fond-principal);
      color: var(--couleur-texte-principal);
      font-family: var(--police-sans);
      min-height: 100vh;
      display: grid;
      /* Colonne gauche : graphe flexible | Colonne droite : légendes 200px fixes */
      grid-template-columns: 1fr 200px;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "entete    entete"
        "graphe    legendes"
        "pied-page pied-page";
    }

    /* ── En-tête ── */
    header {
      grid-area: entete;
      padding: 20px 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .entete-titre h1 { font-size: 18px; font-weight: 500; letter-spacing: -0.3px; }
    .entete-titre p  { font-size: 12px; color: var(--couleur-texte-discret); font-family: var(--police-mono); margin-top: 2px; }

    /* ── Barre d'outils ── */
    .barre-outils { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .barre-outils label  { font-size: 12px; color: var(--couleur-texte-discret); font-family: var(--police-mono); }
    .barre-outils select {
      font-family: var(--police-mono); font-size: 12px; padding: 6px 10px;
      background: var(--couleur-fond-tertiaire); border: 1px solid var(--couleur-bordure-normale);
      border-radius: var(--rayon-bordure); color: var(--couleur-texte-principal); cursor: pointer; outline: none;
    }
    .barre-outils select:hover { border-color: rgba(255,255,255,0.25); }
    .barre-outils button {
      font-family: var(--police-mono); font-size: 11px; padding: 6px 12px;
      background: transparent; border: 1px solid var(--couleur-bordure-normale);
      border-radius: var(--rayon-bordure); color: var(--couleur-texte-secondaire); cursor: pointer;
    }
    .barre-outils button:hover { background: var(--couleur-fond-tertiaire); color: var(--couleur-texte-principal); }

    /* ── Zone du graphe ── */
    #zone-graphe {
      grid-area: graphe;
      position: relative; margin: 16px 8px 16px 16px;
      border: 1px solid var(--couleur-bordure-subtile); border-radius: 14px;
      overflow: hidden; background: var(--couleur-fond-secondaire); min-height: 500px;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* ── Indicateur de chargement ── */
    #indicateur-chargement {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: var(--couleur-texte-discret); font-family: var(--police-mono); font-size: 13px;
    }
    #indicateur-chargement .roue {
      width: 24px; height: 24px;
      border: 2px solid var(--couleur-bordure-normale); border-top-color: var(--couleur-accent);
      border-radius: 50%; animation: rotation 0.8s linear infinite;
    }
    @keyframes rotation { to { transform: rotate(360deg); } }

    /* ── Message d'erreur ── */
    #message-erreur {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      color: #f76f4f; font-family: var(--police-mono); font-size: 13px;
    }

    /* ── Infobulle au survol ── */
    #infobulle {
      position: absolute; pointer-events: none;
      background: var(--couleur-fond-tertiaire); border: 1px solid var(--couleur-bordure-normale);
      border-radius: var(--rayon-bordure); padding: 12px 15px;
      font-size: 13px; display: none; max-width: 230px; z-index: 20;
    }
    #infobulle .info-nom  { font-weight: 500; font-size: 14px; color: var(--couleur-texte-principal); margin-bottom: 4px; }
    #infobulle .info-url  { font-family: var(--police-mono); color: var(--couleur-accent); font-size: 11px; margin-bottom: 6px; word-break: break-all; }
    #infobulle .info-desc { font-size: 12px; color: var(--couleur-texte-secondaire); line-height: 1.6; margin-bottom: 6px; }
    #infobulle .info-cat  { font-family: var(--police-mono); font-size: 10px; color: var(--couleur-texte-discret); }

    /* ── Panneau légendes (colonne droite) ── */
    #panneau-legendes {
      grid-area: legendes;
      display: none; /* affiché par JS après chargement */
      flex-direction: column;
      gap: 24px;
      padding: 16px 16px 16px 8px;
      overflow-y: auto;
    }
    .bloc-legende-titre {
      font-size: 10px; font-family: var(--police-mono);
      color: var(--couleur-texte-discret);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .item-relation {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-family: var(--police-mono); color: var(--couleur-texte-secondaire);
      margin-bottom: 7px;
    }
    .item-categorie {
      display: flex; align-items: center; gap: 9px;
      font-size: 11px; font-family: var(--police-mono); color: var(--couleur-texte-secondaire);
      margin-bottom: 7px;
    }
    .pastille-ronde  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .pastille-carree { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; border: 1px solid #666; }

    footer {
      grid-area: pied-page;
      text-align: center; padding: 10px;
      font-size: 11px; font-family: var(--police-mono); color: var(--couleur-texte-discret);
    }

    /* ── Mode intégré en iframe ── */
    body.integre header   { padding: 10px 14px 0; }
    body.integre #zone-graphe { margin: 10px; }
    body.integre footer   { display: none; }
  </style>
</head>
<body>

<header>
  <div class="entete-titre">
    <h1>Ma cartographie de services</h1>
    <p id="horodatage-maj">chargement…</p>
  </div>
  <div class="barre-outils">
    <label>Terminal</label>
    <select id="selecteur-terminal" onchange="appliquerFiltre()" disabled>
      <option value="tous">Tous les services</option>
    </select>
    <button onclick="recentrerVue()">⟳ Recentrer</button>
  </div>
</header>

<div id="zone-graphe">
  <canvas id="canvas-graphe"></canvas>
  <div id="indicateur-chargement"><div class="roue"></div>Chargement des données…</div>
  <div id="message-erreur"></div>

  <div id="infobulle">
    <div class="info-nom"  id="info-nom"></div>
    <div class="info-url"  id="info-url"></div>
    <div class="info-desc" id="info-desc"></div>
    <div class="info-cat"  id="info-cat"></div>
  </div>

</div>

<!-- Panneau légendes : colonne droite, toujours visible -->
<div id="panneau-legendes">

  <!-- Légende des catégories (en premier, générée dynamiquement) -->
  <div>
    <div class="bloc-legende-titre">Catégories</div>
    <div id="legende-categories"></div>
  </div>

  <!-- Légende des relations -->
  <div>
    <div class="bloc-legende-titre">Relations</div>
    <div id="legende-relations">
      <div class="item-relation">
        <svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#4f8ef7" stroke-width="1.5" stroke-dasharray="5,3"/><polygon points="26,4 20,1 20,7" fill="#4f8ef7"/></svg>
        Authentification
      </div>
      <div class="item-relation">
        <svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#2ecc8a" stroke-width="1.5"/><polygon points="26,4 20,1 20,7" fill="#2ecc8a"/></svg>
        Synchronisation
      </div>
      <div class="item-relation">
        <svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#f76f4f" stroke-width="1.5" stroke-dasharray="2,2"/><polygon points="26,4 20,1 20,7" fill="#f76f4f"/></svg>
        Dépendance
      </div>
    </div>
  </div>

</div>

<footer>glisser · zoomer · cliquer pour ouvrir</footer>

<script>
// ── Détection mode iframe ────────────────────────────────────────────────────
if (window.self !== window.top) {
  document.body.classList.add('integre');
}

// ── Paramètre URL optionnel : ?filter=smartphone ─────────────────────────────
const parametresUrl   = new URLSearchParams(window.location.search);
const filtreInitialUrl = parametresUrl.get('filter') || 'tous';

// ── Références DOM ───────────────────────────────────────────────────────────
const canvasElement        = document.getElementById('canvas-graphe');
const contexteDessin       = canvasElement.getContext('2d');
const zoneGraphe           = document.getElementById('zone-graphe');
const infobulleElement     = document.getElementById('infobulle');
const chargementElement    = document.getElementById('indicateur-chargement');
const erreurElement        = document.getElementById('message-erreur');
const legendeCategories    = document.getElementById('legende-categories');
const legendeRelations     = document.getElementById('legende-relations');

// ── Données globales (remplies après chargement de data.json) ────────────────
let listeMachines  = [];
let listeServices  = [];
let listeRelations = [];

// ── État de la caméra (zoom et déplacement) ───────────────────────────────────
let niveauZoom   = 1;
let decalageX    = 0;
let decalageY    = 0;

// ── État de l'interaction souris ─────────────────────────────────────────────
let noeudEnCours      = null;   // nœud en cours de glissement
let enModePan         = false;  // déplacement de la vue
let originePan        = null;   // position de départ du pan
let deplacement       = false;  // distingue clic simple vs glissement

// ── Filtre actif ─────────────────────────────────────────────────────────────
let filtreTerminalActif = 'tous';

// ════════════════════════════════════════════════════════════════════════════
// CHARGEMENT DES DONNÉES
// ════════════════════════════════════════════════════════════════════════════
async function chargerDonnees() {
  try {
    // Affichage de la version déployée (hash du dernier commit Git)
    const metaCommit = document.querySelector('meta[name="git-commit"]');
    const hashCommit = metaCommit ? metaCommit.getAttribute('content') : 'inconnu';
    console.log('🔖 Version déployée (commit) :', hashCommit);

    console.log('⏳ Chargement de data.json…');
    const reponse = await fetch('data.json?t=' + Date.now());
    console.log('📡 Réponse HTTP :', reponse.status, reponse.ok ? 'OK' : 'ERREUR');
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status}`);
    const donnees = await reponse.json();

    listeMachines  = donnees.machines  || [];
    listeServices  = donnees.services  || [];
    listeRelations = donnees.relations || [];

    // ── Diagnostic console ──────────────────────────────────────────────────
    console.group('📦 Données chargées');
    console.log('🕐 Généré le :', donnees.generatedAt);
    console.log('🖥️  Machines  :', listeMachines.length, listeMachines);
    if (listeServices.length > 0) {
      const premierService = listeServices[0];
      console.log('🔗 1er service :', {
        id:          premierService.id,
        name:        premierService.name,
        category:    premierService.category,
        color:       premierService.color,
        emoji:       premierService.emoji,
        terminals:   premierService.terminals,
        url:         premierService.url,
      });
    }
    if (listeRelations.length > 0) {
      const premiereRelation = listeRelations[0];
      console.log('↔️  1re relation :', {
        source: premiereRelation.source,
        target: premiereRelation.target,
        type:   premiereRelation.type,
      });
    } else {
      console.warn('⚠️  Aucune relation trouvée dans data.json');
    }
    console.groupEnd();

    // Affichage de la date de dernière mise à jour
    const dateMaj = new Date(donnees.generatedAt);
    document.getElementById('horodatage-maj').textContent =
      'mis à jour · ' + dateMaj.toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });

    // Alimentation du sélecteur de terminaux
    const selecteur = document.getElementById('selecteur-terminal');
    selecteur.innerHTML = '<option value="tous">Tous les services</option>';
    listeMachines.forEach(machine => {
      const option = document.createElement('option');
      option.value       = machine.id;
      option.textContent = machine.emoji + ' ' + machine.name;
      selecteur.appendChild(option);
    });

    // Application du filtre venant de l'URL si présent
    if (filtreInitialUrl !== 'tous') selecteur.value = filtreInitialUrl;
    filtreTerminalActif = selecteur.value;
    selecteur.disabled  = false;

    // Construction de la légende des catégories à partir des données
    construireLegendeCategoriesServices();

    // Affichage du panneau de légendes (colonne droite)
    chargementElement.style.display = 'none';
    document.getElementById('panneau-legendes').style.display = 'flex';

    // Diagnostic : affiche les terminaux résolus dans la console du navigateur
    console.log('Machines chargées :', listeMachines.map(m => m.id));
    console.log('Exemple services (terminals) :');
    listeServices.slice(0, 4).forEach(s => console.log(' -', s.name, '→', s.terminals));
    calculerPositions();
    dessinerGraphe();

  } catch (erreur) {
    chargementElement.style.display = 'none';
    erreurElement.style.display     = 'flex';
    erreurElement.innerHTML =
      '<span>⚠ Impossible de charger data.json</span>' +
      '<span style="font-size:11px;color:var(--couleur-texte-discret)">' + erreur.message + '</span>';
  }
}

// Construit la légende des catégories dynamiquement depuis les services chargés
function construireLegendeCategoriesServices() {
  const categoriesVues = new Map();
  listeServices.forEach(service => {
    if (!categoriesVues.has(service.category)) {
      categoriesVues.set(service.category, service.color);
    }
  });

  legendeCategories.innerHTML =
    [...categoriesVues.entries()].map(([nomCategorie, couleur]) =>
      `<div class="item-categorie">
         <div class="pastille-ronde" style="background:${couleur}"></div>
         ${nomCategorie}
       </div>`
    ).join('') +
    `<div class="item-categorie">
       <div class="pastille-carree"></div>
       Terminal physique
     </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// FILTRAGE
// ════════════════════════════════════════════════════════════════════════════

// Retourne les services visibles selon le filtre actif
function obtenirServicesVisibles() {
  if (filtreTerminalActif === 'tous') return listeServices;
  return listeServices.filter(service => service.terminals.includes(filtreTerminalActif));
}

// Retourne les machines visibles :
// - en vue globale : toutes les machines
// - avec filtre actif : uniquement la machine sélectionnée
function obtenirMachinesVisibles() {
  if (filtreTerminalActif === 'tous') return listeMachines;
  return listeMachines.filter(machine => machine.id === filtreTerminalActif);
}

// Retourne les relations dont les deux extrémités sont visibles
function obtenirRelationsVisibles() {
  const idsServicesVisibles = new Set(obtenirServicesVisibles().map(s => s.id));
  return listeRelations.filter(relation =>
    idsServicesVisibles.has(relation.source) && idsServicesVisibles.has(relation.target)
  );
}

function appliquerFiltre() {
  filtreTerminalActif = document.getElementById('selecteur-terminal').value;
  calculerPositions();
  dessinerGraphe();
}

// ════════════════════════════════════════════════════════════════════════════
// POSITIONNEMENT DES NŒUDS
// ════════════════════════════════════════════════════════════════════════════
function calculerPositions() {
  const largeur  = zoneGraphe.clientWidth;
  const hauteur  = zoneGraphe.clientHeight;
  const centreX  = largeur  / 2;
  const centreY  = hauteur  / 2;
  const rayon    = Math.min(largeur, hauteur) * 0.30;

  const servicesVisibles = obtenirServicesVisibles();
  const machinesVisibles = obtenirMachinesVisibles();

  // Disposition des services en cercle
  servicesVisibles.forEach((service, index) => {
    const angle  = (index / servicesVisibles.length) * Math.PI * 2 - Math.PI / 2;
    service.x = centreX + Math.cos(angle) * rayon;
    service.y = centreY + Math.sin(angle) * rayon;
  });

  // Disposition des machines au centre (ou en petit cercle si plusieurs)
  machinesVisibles.forEach((machine, index) => {
    if (machinesVisibles.length === 1) {
      machine.x = centreX;
      machine.y = centreY;
    } else {
      const angle   = (index / machinesVisibles.length) * Math.PI * 2 - Math.PI / 2;
      const rayonCentre = Math.min(largeur, hauteur) * 0.12;
      machine.x = centreX + Math.cos(angle) * rayonCentre;
      machine.y = centreY + Math.sin(angle) * rayonCentre;
    }
  });

  // Réinitialisation de la caméra à chaque changement de filtre
  niveauZoom = 1;
  decalageX  = 0;
  decalageY  = 0;
}

// ════════════════════════════════════════════════════════════════════════════
// CONVERSION DE COORDONNÉES
// ════════════════════════════════════════════════════════════════════════════

// Convertit coordonnées monde → coordonnées écran
function mondeVersEcran(x, y) {
  return { x: x * niveauZoom + decalageX, y: y * niveauZoom + decalageY };
}

// Convertit coordonnées écran → coordonnées monde
function ecranVersMonde(x, y) {
  return { x: (x - decalageX) / niveauZoom, y: (y - decalageY) / niveauZoom };
}

// ════════════════════════════════════════════════════════════════════════════
// DESSIN
// ════════════════════════════════════════════════════════════════════════════

// Dessine une flèche directionnelle entre deux nœuds
function dessinerFleche(xDepart, yDepart, xArrivee, yArrivee, couleur, tirets) {
  const deltaX    = xArrivee - xDepart;
  const deltaY    = yArrivee - yDepart;
  const longueur  = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
  if (longueur < 1) return;

  const unitX = deltaX / longueur;
  const unitY = deltaY / longueur;
  const rayonNoeud = 28;

  // Trait de la flèche
  contexteDessin.beginPath();
  contexteDessin.setLineDash(tirets || []);
  contexteDessin.moveTo(xDepart  + unitX * rayonNoeud, yDepart  + unitY * rayonNoeud);
  contexteDessin.lineTo(xArrivee - unitX * rayonNoeud, yArrivee - unitY * rayonNoeud);
  contexteDessin.strokeStyle = couleur;
  contexteDessin.lineWidth   = 1.5;
  contexteDessin.stroke();
  contexteDessin.setLineDash([]);

  // Pointe de la flèche
  const xPointe     = xArrivee - unitX * rayonNoeud;
  const yPointe     = yArrivee - unitY * rayonNoeud;
  const longueurAile = 9;
  const largeurAile  = 4.5;
  const xBase = xPointe - unitX * longueurAile;
  const yBase = yPointe - unitY * longueurAile;
  const perpX = -unitY;
  const perpY =  unitX;

  contexteDessin.beginPath();
  contexteDessin.moveTo(xPointe, yPointe);
  contexteDessin.lineTo(xBase + perpX * largeurAile, yBase + perpY * largeurAile);
  contexteDessin.lineTo(xBase - perpX * largeurAile, yBase - perpY * largeurAile);
  contexteDessin.closePath();
  contexteDessin.fillStyle = couleur;
  contexteDessin.fill();
}

// Dessine un rectangle aux coins arrondis
function dessinerRectangleArrondi(x, y, largeur, hauteur, rayon) {
  contexteDessin.beginPath();
  contexteDessin.moveTo(x + rayon, y);
  contexteDessin.lineTo(x + largeur - rayon, y);
  contexteDessin.arcTo(x + largeur, y, x + largeur, y + rayon, rayon);
  contexteDessin.lineTo(x + largeur, y + hauteur - rayon);
  contexteDessin.arcTo(x + largeur, y + hauteur, x + largeur - rayon, y + hauteur, rayon);
  contexteDessin.lineTo(x + rayon, y + hauteur);
  contexteDessin.arcTo(x, y + hauteur, x, y + hauteur - rayon, rayon);
  contexteDessin.lineTo(x, y + rayon);
  contexteDessin.arcTo(x, y, x + rayon, y, rayon);
  contexteDessin.closePath();
}

// Fonction principale de rendu du graphe
function dessinerGraphe() {
  const largeurCanvas = zoneGraphe.clientWidth;
  const hauteurCanvas = zoneGraphe.clientHeight;
  canvasElement.width  = largeurCanvas;
  canvasElement.height = hauteurCanvas;
  contexteDessin.clearRect(0, 0, largeurCanvas, hauteurCanvas);

  const servicesVisibles  = obtenirServicesVisibles();
  const machinesVisibles  = obtenirMachinesVisibles();
  const relationsVisibles = obtenirRelationsVisibles();

  // ── 1. Lignes de connexion machine → service (quand un filtre est actif) ──
  machinesVisibles.forEach(machine => {
    servicesVisibles.forEach(service => {
      if (!service.terminals.includes(machine.id)) return;
      const posMachine = mondeVersEcran(machine.x, machine.y);
      const posService = mondeVersEcran(service.x, service.y);
      contexteDessin.beginPath();
      contexteDessin.setLineDash([3 * niveauZoom, 5 * niveauZoom]);
      contexteDessin.moveTo(posMachine.x, posMachine.y);
      contexteDessin.lineTo(posService.x,  posService.y);
      contexteDessin.strokeStyle = 'rgba(255,255,255,0.06)';
      contexteDessin.lineWidth   = 1;
      contexteDessin.stroke();
      contexteDessin.setLineDash([]);
    });
  });

  // ── 2. Flèches de relations entre services ────────────────────────────────
  relationsVisibles.forEach(relation => {
    const serviceSource = listeServices.find(s => s.id === relation.source);
    const serviceCible  = listeServices.find(s => s.id === relation.target);
    if (!serviceSource || !serviceCible) return;

    const posSource = mondeVersEcran(serviceSource.x, serviceSource.y);
    const posCible  = mondeVersEcran(serviceCible.x,  serviceCible.y);

    const couleurRelation = relation.type === 'auth'    ? '#4f8ef7'
                          : relation.type === 'sync'    ? '#2ecc8a'
                          : '#f76f4f'; // depends

    const tirets = relation.type === 'auth'    ? [5 * niveauZoom, 3 * niveauZoom]
                 : relation.type === 'depends' ? [2 * niveauZoom, 2 * niveauZoom]
                 : [];

    dessinerFleche(posSource.x, posSource.y, posCible.x, posCible.y, couleurRelation, tirets);
  });

  // ── 3. Nœuds des machines (rectangles arrondis) ───────────────────────────
  machinesVisibles.forEach(machine => {
    const position   = mondeVersEcran(machine.x, machine.y);
    const largeurRect = 70  * Math.min(niveauZoom, 1.4);
    const hauteurRect = 50  * Math.min(niveauZoom, 1.4);
    const rayonCoin   = 10;

    // Fond du rectangle
    dessinerRectangleArrondi(
      position.x - largeurRect / 2,
      position.y - hauteurRect / 2,
      largeurRect, hauteurRect, rayonCoin
    );
    contexteDessin.fillStyle   = 'rgba(85,91,112,0.25)';
    contexteDessin.fill();
    contexteDessin.strokeStyle = '#888780';
    contexteDessin.lineWidth   = 1.5;
    contexteDessin.stroke();

    // Emoji de la machine (dessiné après la forme → premier plan)
    // On sauvegarde et restaure le contexte pour ne pas polluer fillStyle
    contexteDessin.save();
    const tailleEmoji = Math.max(16, Math.round(22 * Math.min(niveauZoom, 1.4)));
    contexteDessin.font              = `${tailleEmoji}px serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji`;
    contexteDessin.textAlign         = 'center';
    contexteDessin.textBaseline      = 'middle';
    contexteDessin.globalAlpha       = 1;
    contexteDessin.fillStyle         = 'black'; // requis pour que les emojis couleur s'affichent
    contexteDessin.fillText(machine.emoji, position.x, position.y);
    contexteDessin.restore();
  });

  // ── 4. Nœuds des services (cercles) ──────────────────────────────────────
  servicesVisibles.forEach(service => {
    const position   = mondeVersEcran(service.x, service.y);
    const rayonCercle = 26 * Math.min(niveauZoom, 1.4);

    // Fond coloré du cercle
    contexteDessin.beginPath();
    contexteDessin.arc(position.x, position.y, rayonCercle, 0, Math.PI * 2);
    contexteDessin.fillStyle = service.color + '40'; // opacité 25%
    contexteDessin.fill();

    // Bordure colorée
    contexteDessin.strokeStyle = service.color;
    contexteDessin.lineWidth   = 1.5;
    contexteDessin.stroke();

    // Emoji du service (dessiné après le cercle → premier plan, couleurs vives)
    // save/restore isole le fillStyle pour que l'emoji ne soit pas teint par la couleur du cercle
    contexteDessin.save();
    const tailleEmoji = Math.max(13, Math.round(rayonCercle * 0.88));
    contexteDessin.font              = `${tailleEmoji}px serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji`;
    contexteDessin.textAlign         = 'center';
    contexteDessin.textBaseline      = 'middle';
    contexteDessin.globalAlpha       = 1;
    contexteDessin.fillStyle         = 'black'; // requis pour que les emojis couleur s'affichent
    contexteDessin.fillText(service.emoji, position.x, position.y + 1);
    contexteDessin.restore();
  });
}

// ════════════════════════════════════════════════════════════════════════════
// DÉTECTION DU NŒUD SOUS LE CURSEUR
// ════════════════════════════════════════════════════════════════════════════
function trouverNoeudSousCurseur(xEcran, yEcran) {
  const positionMonde = ecranVersMonde(xEcran, yEcran);

  // Test des machines (zone rectangulaire)
  for (const machine of obtenirMachinesVisibles()) {
    const demiLargeur = 36;
    const demiHauteur = 26;
    if (
      positionMonde.x >= machine.x - demiLargeur &&
      positionMonde.x <= machine.x + demiLargeur &&
      positionMonde.y >= machine.y - demiHauteur &&
      positionMonde.y <= machine.y + demiHauteur
    ) return machine;
  }

  // Test des services (zone circulaire)
  return obtenirServicesVisibles().find(service => {
    const distanceX = service.x - positionMonde.x;
    const distanceY = service.y - positionMonde.y;
    return Math.sqrt(distanceX * distanceX + distanceY * distanceY) < 28;
  });
}

// Extrait la position de la souris ou du doigt relativement au canvas
function obtenirPositionEvenement(evenement) {
  const rect   = canvasElement.getBoundingClientRect();
  const source = evenement.touches ? evenement.touches[0] : evenement;
  return { x: source.clientX - rect.left, y: source.clientY - rect.top };
}

// ════════════════════════════════════════════════════════════════════════════
// GESTION DE L'INFOBULLE
// ════════════════════════════════════════════════════════════════════════════
function afficherInfobulle(noeud, xEcran, yEcran) {
  infobulleElement.style.display = 'block';

  // Positionnement intelligent (évite de sortir du canvas)
  let posGauche = xEcran + 16;
  let posHaut   = yEcran - 10;
  if (posGauche + 240 > zoneGraphe.clientWidth)  posGauche = xEcran - 250;
  if (posHaut   + 130 > zoneGraphe.clientHeight) posHaut   = zoneGraphe.clientHeight - 140;

  infobulleElement.style.left = posGauche + 'px';
  infobulleElement.style.top  = posHaut   + 'px';

  document.getElementById('info-nom').textContent  = noeud.name        || '';
  document.getElementById('info-url').textContent  = noeud.url         || '';
  document.getElementById('info-desc').textContent = noeud.description || noeud.desc || '';
  document.getElementById('info-cat').textContent  = noeud.category
    ? 'catégorie · ' + noeud.category
    : 'terminal physique';
}

function masquerInfobulle() {
  infobulleElement.style.display = 'none';
}

// ════════════════════════════════════════════════════════════════════════════
// INTERACTIONS SOURIS
// ════════════════════════════════════════════════════════════════════════════
canvasElement.addEventListener('mousedown', evenement => {
  const position = obtenirPositionEvenement(evenement);
  deplacement    = false;
  const noeudCible = trouverNoeudSousCurseur(position.x, position.y);

  if (noeudCible) {
    // Début de glissement d'un nœud
    noeudEnCours = noeudCible;
  } else {
    // Début de déplacement de la vue (pan)
    enModePan  = true;
    originePan = { x: position.x, y: position.y, decalageX, decalageY };
  }
});

window.addEventListener('mousemove', evenement => {
  const position = obtenirPositionEvenement(evenement);

  if (noeudEnCours) {
    // Glissement d'un nœud
    deplacement = true;
    const posMonde = ecranVersMonde(position.x, position.y);
    noeudEnCours.x = posMonde.x;
    noeudEnCours.y = posMonde.y;
    dessinerGraphe();
    canvasElement.style.cursor = 'grabbing';
    masquerInfobulle();
    return;
  }

  if (enModePan && originePan) {
    // Déplacement de la vue
    deplacement = true;
    decalageX = originePan.decalageX + (position.x - originePan.x);
    decalageY = originePan.decalageY + (position.y - originePan.y);
    dessinerGraphe();
    canvasElement.style.cursor = 'grabbing';
    return;
  }

  // Survol : affichage de l'infobulle
  const noeudSurvole = trouverNoeudSousCurseur(position.x, position.y);
  canvasElement.style.cursor = noeudSurvole ? 'pointer' : 'default';

  if (noeudSurvole) {
    afficherInfobulle(noeudSurvole, position.x, position.y);
  } else {
    masquerInfobulle();
  }
});

window.addEventListener('mouseup', evenement => {
  // Clic simple sans déplacement → ouvre l'URL du service
  if (!deplacement && noeudEnCours && noeudEnCours.url) {
    window.open(noeudEnCours.url, '_blank');
  }
  noeudEnCours = null;
  enModePan    = false;
  originePan   = null;
  canvasElement.style.cursor = 'default';
  masquerInfobulle();
});

// Zoom à la molette
canvasElement.addEventListener('wheel', evenement => {
  evenement.preventDefault();
  const position    = obtenirPositionEvenement(evenement);
  const facteurZoom = evenement.deltaY > 0 ? 0.9 : 1.1;
  const nouveauZoom = Math.min(Math.max(niveauZoom * facteurZoom, 0.3), 3);

  // Zoom centré sur la position du curseur
  decalageX = position.x - (position.x - decalageX) * (nouveauZoom / niveauZoom);
  decalageY = position.y - (position.y - decalageY) * (nouveauZoom / niveauZoom);
  niveauZoom = nouveauZoom;
  dessinerGraphe();
}, { passive: false });

// ════════════════════════════════════════════════════════════════════════════
// UTILITAIRES
// ════════════════════════════════════════════════════════════════════════════

// Réinitialise la vue et repositionne tous les nœuds
function recentrerVue() {
  calculerPositions();
  dessinerGraphe();
}

// Redessine lors d'un redimensionnement de la fenêtre
window.addEventListener('resize', () => {
  calculerPositions();
  dessinerGraphe();
});

// ── Démarrage ─────────────────────────────────────────────────────────────────
chargerDonnees();
</script>
